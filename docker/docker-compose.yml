services:
  # -------------------------------------------------------------------------
  # 1. MongoDB Service (uses hardcoded values that mimic your .env file)
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: dev-mongodb
    restart: always
    ports:
      # Loopback only: hardcoded dev creds must never be reachable from the LAN.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      # Values are hardcoded but align with what your application expects
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpassword
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 2s
      retries: 5

  # -------------------------------------------------------------------------
  # 2. RustFS Service (S3-compatible object storage)
  # -------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: dev-rustfs
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  # -------------------------------------------------------------------------
  # 3. Bucket creation (one-shot, idempotent)
  # -------------------------------------------------------------------------
  rustfs-setup:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    container_name: dev-rustfs-setup
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin;
      for b in jewellery-catalogue-staging jewellery-catalogue shoppingo; do
        rc bucket create local/$$b --ignore-existing;
        rc bucket anonymous set download local/$$b;
      done
      "
    restart: "no"

  # -------------------------------------------------------------------------
  # 4. Navidrome (music server — used by mixtape local dev)
  # -------------------------------------------------------------------------
  navidrome:
    image: deluan/navidrome:latest
    container_name: dev-navidrome
    restart: unless-stopped
    ports:
      - "127.0.0.1:4533:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_SCANSCHEDULE: 1m
      ND_LOGLEVEL: info
    volumes:
      # mixtape (run locally via `bun run start`) writes mp3s here with MUSIC_ROOT=mixtape/music.
      # Path is relative to this compose file (utils/docker) → ../../mixtape/music.
      - ../../mixtape/music:/music
      - navidrome_data:/data

volumes:
  mongo_data:
  rustfs_data:
  navidrome_data:
